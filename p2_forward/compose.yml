# Isolated compose project `tsb-p2-forward` (NOT the production compose). No autostart: restart "no".
# G2-Repeat revision: the data directory is a per-run dataset identity (P2F_DATA_DIR); the image ID claim
# (P2F_IMAGE_ID) is persisted in the run record and verified by the gate script against the running container.
name: tsb-p2-forward
services:
  collector:
    image: ${P2F_IMAGE:?set P2F_IMAGE to the reviewed image}
    container_name: tsb-p2-forward-collector
    restart: "no"
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      P2F_CONFIG: /config/collector.json
      P2F_IMAGE_ID: ${P2F_IMAGE_ID:?set P2F_IMAGE_ID to the reviewed image ID}
    volumes:
      - ${P2F_DATA_DIR:?set P2F_DATA_DIR to the run dataset directory}:/data:rw
      - ${P2F_CONFIG_FILE:?set P2F_CONFIG_FILE}:/config/collector.json:ro
    networks: [p2f]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  p2f:
    name: tsb-p2-forward-net
    driver: bridge
