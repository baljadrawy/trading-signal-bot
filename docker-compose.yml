# يعمل على: Raspberry Pi 4 (arm64) و Hetzner VPS (amd64)
# ملاحظة: postgres يعمل كخدمة مشتركة في /home/tradmin/shared-postgres

networks:
  trading_network:
    driver: bridge
  shared_db_net:
    external: true

volumes:
  models_data:
  logs_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-build-args: &build-args
  APP_VERSION: ${APP_VERSION:-sb-2026.08}
  BUILD_REVISION: ${BUILD_REVISION:-unknown}

x-hardened-runtime: &hardened-runtime
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777

services:

  # ==================== Scanner ====================
  scanner:
    <<: *hardened-runtime
    image: tsb-aiohttp-test-scanner:3.14.3-20260929T124120Z   # approved aiohttp 3.14.3 thin overlay; see deploy/aiohttp-3.14.3/IMAGES.md
    pull_policy: never
    container_name: trading_scanner
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
      - .env.binance   # مفاتيح Binance — scanner و analyzer فقط
    environment:
      SERVICE_NAME: scanner
      HEALTH_MAX_AGE_SECONDS: "900"
    volumes:
      - logs_data:/app/logs
    networks:
      - trading_network
      - shared_db_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  # ==================== Analyzer ====================
  analyzer:
    <<: *hardened-runtime
    image: tsb-a561-analyzer:rel-ea8ae4f-r2   # A56.1 release ea8ae4f; rollback = tsb-p1d-analyzer:p1d-59297305-20261001T2045Z
    pull_policy: never
    container_name: trading_analyzer
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
      - .env.binance   # مفاتيح Binance — scanner و analyzer فقط
    environment:
      EVIDENCE_V2_ENABLED: "true"   # P1-ACT: forward instrumentation ON (owner-authorized); rollback = "false"
      SERVICE_NAME: analyzer
      HEALTH_MAX_AGE_SECONDS: "300"
      # D3B-1: analyzer code never reads these; blank overrides keep the shared .env values out of this container
      CMC_PRO_API_KEY: ""
      COINGECKO_API_KEY: ""
    volumes:
      # P1-D evidence v2: one shared host dir; each service writes only its own <service>/ subdir
      - ./data/evidence_v2:/app/data/evidence_v2
      - logs_data:/app/logs
      - models_data:/app/models
    networks:
      - trading_network
      - shared_db_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.5'

  # ==================== Signal Engine ====================
  signal_engine:
    <<: *hardened-runtime
    image: tsb-a561-signal_engine:rel-ea8ae4f-r2   # A56.1 release ea8ae4f; rollback = tsb-p1d-signal_engine:p1d-59297305-20261001T2045Z
    pull_policy: never
    container_name: trading_signal_engine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      EVIDENCE_V2_ENABLED: "true"   # P1-ACT: forward instrumentation ON (owner-authorized); rollback = "false"
      SERVICE_NAME: signal_engine
      HEALTH_MAX_AGE_SECONDS: "180"
      LEARNING_CLEAN_START: ${LEARNING_CLEAN_START:-2026-07-20T00:00:00}
      LEARNING_CONFIDENCE_Z: ${LEARNING_CONFIDENCE_Z:-1.96}
      LEARNING_EXPLORATION_RATE: ${LEARNING_EXPLORATION_RATE:-0.10}
      CMC_PRO_API_KEY: ""
      COINGECKO_API_KEY: ""
    volumes:
      # P1-D evidence v2: one shared host dir; each service writes only its own <service>/ subdir
      - ./data/evidence_v2:/app/data/evidence_v2
      - logs_data:/app/logs
      - models_data:/app/models
      # Evidence output is the only writable host path used by Signal Engine.
      - ./data/evidence:/app/data/evidence
    networks:
      - trading_network
      - shared_db_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  # ==================== Trade Tracker ====================
  trade_tracker:
    <<: *hardened-runtime
    image: tsb-obs-trade_tracker:bb7825f-20261027-r2   # Paper observe bb7825f (sha256:8e609ca84740…); rollback = tsb-a561-trade_tracker:rel-ea8ae4f-r2
    pull_policy: never
    container_name: trading_tracker
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      EVIDENCE_V2_ENABLED: "true"   # P1-ACT: forward instrumentation ON (owner-authorized); rollback = "false"
      SERVICE_NAME: trade_tracker
      HEALTH_MAX_AGE_SECONDS: "600"
      PAPER_ECONOMIC_HALT_MODE: "observe"   # owner-authorized Paper economic observation (econ-observe-v1); rollback = "enforce"
    volumes:
      # P1-D evidence v2: one shared host dir; each service writes only its own <service>/ subdir
      - ./data/evidence_v2:/app/data/evidence_v2
      - logs_data:/app/logs
    networks:
      - trading_network
      - shared_db_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # ==================== Optimizer Agent ====================
  # DISABLED 2026-06-19 أثناء تجميد الاستراتيجية (منذ 2026-05-17).
  # المحسن كان يعدّل indicator_weights/optimizer_settings حياً كل ساعة — مخالف لبند التجميد.
  # profiles=["disabled"] يمنع `docker compose up -d` من إعادة تشغيله.
  # لإعادة تفعيله بعد رفع التجميد: احذف سطر profiles ثم `docker compose up -d optimizer`.
  optimizer:
    <<: *hardened-runtime
    profiles: ["disabled"]
    build:
      context: .
      dockerfile: optimizer/Dockerfile
      args: *build-args
    container_name: trading_optimizer
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - logs_data:/app/logs
    networks:
      - trading_network
      - shared_db_net
    healthcheck:
      test: ["CMD-SHELL", "grep -q python /proc/1/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # ==================== Continuous Learner ====================
  continuous_learner:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: signal_engine/Dockerfile
      args: *build-args
    container_name: trading_continuous_learner
    profiles: ["learner"]   # excluded from default startup only; NOT an authorization control — never target directly (docs/ops/COMPOSE_OPERATIONS.md)
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      LIVE_LEARNING_MODE: ${LIVE_LEARNING_MODE}
      SERVICE_NAME: continuous_learner
      HEALTH_MAX_AGE_SECONDS: "93600"
      LEARNING_CLEAN_START: ${LEARNING_CLEAN_START:-2026-07-20T00:00:00}
      LEARNING_CONFIDENCE_Z: ${LEARNING_CONFIDENCE_Z:-1.96}
      LEARNING_EXPLORATION_RATE: ${LEARNING_EXPLORATION_RATE:-0.10}
    command: >
      sh -c "while true; do PYTHONPATH=/app python research/continuous_learner.py || true;
             sleep $$(( ${LEARN_CRON_HOURS:-12} * 3600 )); done"
    networks:
      - shared_db_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256m

  # ==================== Telegram ====================
  telegram:
    <<: *hardened-runtime
    image: tsb-a561-telegram:rel-ea8ae4f-r2   # A56.1 release ea8ae4f; rollback = tsb-p1d-telegram:p1d-59297305-20261001T2045Z
    pull_policy: never
    container_name: trading_telegram
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      EVIDENCE_V2_ENABLED: "true"   # P1-ACT: forward instrumentation ON (owner-authorized); rollback = "false"
      SERVICE_NAME: telegram
      HEALTH_MAX_AGE_SECONDS: "120"
    volumes:
      # P1-D evidence v2: one shared host dir; each service writes only its own <service>/ subdir
      - ./data/evidence_v2:/app/data/evidence_v2
      - logs_data:/app/logs
    networks:
      - trading_network
      - shared_db_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
