# Test-only CI (A49; main-first triggers and collector job added 2026-10-18). Runs the unit suite, the
# disposable-PostgreSQL matrix and the P2 forward collector suite exactly as the local gates do. It has no secrets,
# deploys nothing, builds no images and never touches production (GitHub-hosted runners, contents: read only).
name: tests

on:
  push:
    branches: ['integration/**', 'develop', 'main']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: default suite (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements-test.txt
      - run: python -m pip install -r .github/ci/requirements-test.txt
      - run: python -m pytest -q -p no:cacheprovider -rs tests

  database:
    name: disposable-PostgreSQL matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: ci-throwaway          # ephemeral service container, not a secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGURL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/postgres
      TEMPLATE: p1_schema
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                             # reference trees below are older commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements-test.txt
      - run: python -m pip install -r .github/ci/requirements-test.txt
      - name: reference trees (read-only checkouts of reviewed commits)
        run: |
          git worktree add -q ../ref-cr1 f973cac        # develop at CR-1 (P1-R parity "before")
          git worktree add -q ../ref-prefix da256f7     # pre-P1-fix tree (test_p1fix)
          git worktree add -q ../ref-prod 5929730       # production source (A39 / A44 old tree)
          if git rev-parse -q --verify origin/fix/a38-paper-execution-integrity >/dev/null; then
            git worktree add -q ../ref-a38 origin/fix/a38-paper-execution-integrity
          fi
      - run: .github/ci/build_schema_template.sh
      - name: full suite with databases
        env:
          RISK_TEST_DSN: ${{ env.PGURL }}
          P1R_TEST_DSN: ${{ env.PGURL }}
          SIGNAL_READY_TEST_DSN: ${{ env.PGURL }}
          P1_DB_DSN: ${{ env.PGURL }}
          A43_TEST_DSN: ${{ env.PGURL }}
          P1_SCHEMA_TEMPLATE: ${{ env.TEMPLATE }}
          P1_BEFORE_TREE: ${{ github.workspace }}/../ref-cr1
          A44_OLD_TREE: ${{ github.workspace }}/../ref-prod
          A44_A38_TREE: ${{ github.workspace }}/../ref-a38
        # Known environment mapping: test_p1fix's 200-expiry case needs the pre-fix tree as
        # P1_BEFORE_TREE, so it is deselected here and run in the next step with that tree.
        run: >-
          python -m pytest -q -p no:cacheprovider -rs tests
          --deselect tests/test_p1fix_evidence_reliability.py::test_more_than_200_expired_no_starvation_bounded_and_dedup
      - name: test_p1fix with the pre-fix tree
        env:
          RISK_TEST_DSN: ${{ env.PGURL }}
          P1R_TEST_DSN: ${{ env.PGURL }}
          P1_DB_DSN: ${{ env.PGURL }}
          P1_SCHEMA_TEMPLATE: ${{ env.TEMPLATE }}
          P1_BEFORE_TREE: ${{ github.workspace }}/../ref-prefix
        run: python -m pytest -q -p no:cacheprovider -rs tests/test_p1fix_evidence_reliability.py
      - name: A39 mixed-version suite with the production tree
        env:
          RISK_TEST_DSN: ${{ env.PGURL }}
          P1R_TEST_DSN: ${{ env.PGURL }}
          P1_DB_DSN: ${{ env.PGURL }}
          P1_SCHEMA_TEMPLATE: ${{ env.TEMPLATE }}
          P1_BEFORE_TREE: ${{ github.workspace }}/../ref-prod
        run: |
          if [ -f tests/test_a39_review.py ]; then
            python -m pytest -q -p no:cacheprovider -rs tests/test_a39_review.py
          else
            echo "tests/test_a39_review.py not present on this tree"
          fi

  collector:
    name: P2 forward collector suite (p2_forward/tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                             # test_p2f_recovery_a34 archives the pre-fix tree cd2935e
          persist-credentials: false
      - name: presence check
        id: present
        run: |
          if [ -d p2_forward/tests ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "p2_forward/tests not present on this tree"; fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: install the collector's exact pinned set (no dependency resolution) and pytest
        if: steps.present.outputs.run == 'true'
        run: |
          python -m pip install --no-deps --only-binary=:all: -r p2_forward/requirements.txt
          python -m pip install "$(grep -E '^pytest==' .github/ci/requirements-test.txt)"
          python -m pip check
      - name: collector tests
        if: steps.present.outputs.run == 'true'
        working-directory: p2_forward
        run: python -m pytest -q -p no:cacheprovider -rs tests

  parity-inventory:
    name: R1.4 static parity inventory (legacy gaps expected)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory known legacy release gaps without false certification
        run: |
          set +e
          python ops/provenance/parity_inventory.py > parity-report.json
          rc=$?
          set -e
          cat parity-report.json
          python - <<'PY'
          import json
          p = json.load(open("parity-report.json"))
          assert p["schema"] == "tsb-r14-static-audit/2"
          assert p["scope"] == "GITHUB_STATIC_ONLY"
          assert p["runtime_parity_verified"] is False
          services = {s["service"]: s for s in p["services"]}
          assert set(services) == {"scanner", "analyzer", "signal_engine", "trade_tracker", "telegram", "collector"}
          assert all(s["runtime_verified"] is False for s in services.values()), "runtime parity claimed from GitHub"
          assert p["blockers"], "Unexpected readiness: review the gate before accepting a release"
          PY
          test "$rc" -eq 2
      - name: Parity inventory unit and negative tests
        run: |
          python -m pip install "$(grep -E '^pytest==' .github/ci/requirements-test.txt)"
          python -m pytest -q -p no:cacheprovider tests/test_parity_inventory.py
