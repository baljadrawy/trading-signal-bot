name: r14-lock-review
on:
  pull_request:
    branches: [main]
    # Not a required check. Runs only when one of its inputs changes (docs/ops/CI_EFFICIENCY.md);
    # its pytest file also runs in the required "default suite (no database)" on every PR.
    paths:
      - '.github/**'
      - 'ops/provenance/**'
      - 'tests/test_r14_*'
      - '**/conftest.py'
      - '**/requirements*'
      - '**/constraints*'
      - '**/*.lock'
      - '**/pytest.ini'
      - '**/pyproject.toml'
      - '**/setup.cfg'
      - '**/tox.ini'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r14-lock-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q -p no:cacheprovider tests/test_r14_lock_review.py
