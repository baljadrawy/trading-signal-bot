name: r14-build-readiness
on:
  pull_request:
    branches: [main]
    # Not a required check. Runs only when one of its inputs changes (docs/ops/CI_EFFICIENCY.md);
    # its pytest file also runs in the required "default suite (no database)" on every PR.
    paths:
      - '.github/**'
      - 'ops/provenance/**'
      - 'tests/test_r14_*'
      - '**/conftest.py'
      - '**/requirements*'
      - '**/constraints*'
      - '**/*.lock'
      - '**/pytest.ini'
      - '**/pyproject.toml'
      - '**/setup.cfg'
      - '**/tox.ini'
      - 'scanner/Dockerfile*'
      - 'analyzer/Dockerfile*'
      - 'signal_engine/Dockerfile*'
      - 'trade_tracker/Dockerfile*'
      - 'telegram/Dockerfile*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r14-build-readiness-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test preflight detectors
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q -p no:cacheprovider tests/test_r14_build_preflight.py
      - name: Check known missing locks (not a build certification)
        run: |
          python - <<'PY'
          from pathlib import Path
          from ops.provenance.build_preflight import SERVICES, check
          for service in SERVICES:
              gaps = check(Path("."), service, "a"*40)
              assert "missing committed requirements.lock" in gaps, (service, gaps)
              print(f"{service}: BLOCKED (dependency lock missing)")
          PY
